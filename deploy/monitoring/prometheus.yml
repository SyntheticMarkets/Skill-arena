global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: skill-arena

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: skill-arena-backend
    metrics_path: /metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets:
          - backend:8080
