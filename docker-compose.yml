services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillarena
      POSTGRES_USER: skillarena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillarena -d skillarena"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  object-storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set skill-arena http://object-storage:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing skill-arena/skill-arena-financial
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SKILL_ARENA_ENV: production
      SKILL_ARENA_HTTP_ADDR: ":8080"
      SKILL_ARENA_DATABASE_URL: "postgresql://skillarena:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/skillarena?sslmode=disable"
      SKILL_ARENA_DATABASE_MAX_OPEN_CONNS: ${SKILL_ARENA_DATABASE_MAX_OPEN_CONNS:-50}
      SKILL_ARENA_DATABASE_MAX_IDLE_CONNS: ${SKILL_ARENA_DATABASE_MAX_IDLE_CONNS:-20}
      SKILL_ARENA_REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379"
      SKILL_ARENA_JWT_SECRET: ${SKILL_ARENA_JWT_SECRET:?SKILL_ARENA_JWT_SECRET is required}
      SKILL_ARENA_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      SKILL_ARENA_MFA_ENCRYPTION_KEY: ${SKILL_ARENA_MFA_ENCRYPTION_KEY:?SKILL_ARENA_MFA_ENCRYPTION_KEY is required}
      SKILL_ARENA_PUZZLE_SECRET: ${SKILL_ARENA_PUZZLE_SECRET:?SKILL_ARENA_PUZZLE_SECRET is required}
      SKILL_ARENA_PUZZLE_ENCRYPTION_KEY: ${SKILL_ARENA_PUZZLE_ENCRYPTION_KEY:?SKILL_ARENA_PUZZLE_ENCRYPTION_KEY is required}
      SKILL_ARENA_REPLAY_SIGNING_KEY: ${SKILL_ARENA_REPLAY_SIGNING_KEY:?SKILL_ARENA_REPLAY_SIGNING_KEY is required}
      SKILL_ARENA_REPLAY_SIGNING_KEY_ID: ${SKILL_ARENA_REPLAY_SIGNING_KEY_ID:?SKILL_ARENA_REPLAY_SIGNING_KEY_ID is required}
      SKILL_ARENA_REPLAY_VERIFICATION_KEYS: '${SKILL_ARENA_REPLAY_VERIFICATION_KEYS:-{}}'
      SKILL_ARENA_COOKIE_SECURE: "true"
      SKILL_ARENA_PUBLIC_BASE_URL: ${SKILL_ARENA_PUBLIC_BASE_URL:?SKILL_ARENA_PUBLIC_BASE_URL is required}
      SKILL_ARENA_ADMIN_BASE_URL: ${SKILL_ARENA_ADMIN_BASE_URL:?SKILL_ARENA_ADMIN_BASE_URL is required}
      SKILL_ARENA_ALLOWED_ORIGINS: ${SKILL_ARENA_ALLOWED_ORIGINS:?SKILL_ARENA_ALLOWED_ORIGINS is required}
      SKILL_ARENA_EMAIL_OUTBOX_ONLY: "false"
      SKILL_ARENA_SMTP_HOST: ${SKILL_ARENA_SMTP_HOST:?SKILL_ARENA_SMTP_HOST is required}
      SKILL_ARENA_SMTP_PORT: ${SKILL_ARENA_SMTP_PORT:-587}
      SKILL_ARENA_SMTP_USER: ${SKILL_ARENA_SMTP_USER:-}
      SKILL_ARENA_SMTP_PASS: ${SKILL_ARENA_SMTP_PASS:-}
      SKILL_ARENA_EMAIL_FROM: ${SKILL_ARENA_EMAIL_FROM:?SKILL_ARENA_EMAIL_FROM is required}
      SKILL_ARENA_STORAGE_PROVIDER: "s3-compatible"
      SKILL_ARENA_S3_ENDPOINT: "http://object-storage:9000"
      SKILL_ARENA_S3_BUCKET: "skill-arena-financial"
      SKILL_ARENA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      SKILL_ARENA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      SKILL_ARENA_S3_REGION: ${SKILL_ARENA_S3_REGION:-us-east-1}
      SKILL_ARENA_PAYMENT_ACTIVE_PROVIDERS: ${SKILL_ARENA_PAYMENT_ACTIVE_PROVIDERS:?SKILL_ARENA_PAYMENT_ACTIVE_PROVIDERS is required}
      SKILL_ARENA_PAYMENT_DEFAULT_PROVIDER: ${SKILL_ARENA_PAYMENT_DEFAULT_PROVIDER:?SKILL_ARENA_PAYMENT_DEFAULT_PROVIDER is required}
      SKILL_ARENA_PAYMENT_ROUTES: ${SKILL_ARENA_PAYMENT_ROUTES:-}
      SKILL_ARENA_STRIPE_SECRET_KEY: ${SKILL_ARENA_STRIPE_SECRET_KEY:-}
      SKILL_ARENA_STRIPE_WEBHOOK_SECRET: ${SKILL_ARENA_STRIPE_WEBHOOK_SECRET:-}
      SKILL_ARENA_STRIPE_API_BASE: ${SKILL_ARENA_STRIPE_API_BASE:-https://api.stripe.com}
      SKILL_ARENA_STRIPE_MODE: ${SKILL_ARENA_STRIPE_MODE:-sandbox}
      SKILL_ARENA_REALTIME_QUEUE_TTL_SECONDS: ${SKILL_ARENA_REALTIME_QUEUE_TTL_SECONDS:-120}
      SKILL_ARENA_REALTIME_PRESENCE_TTL_SECONDS: ${SKILL_ARENA_REALTIME_PRESENCE_TTL_SECONDS:-45}
      SKILL_ARENA_REALTIME_RECONNECT_SECONDS: ${SKILL_ARENA_REALTIME_RECONNECT_SECONDS:-30}
      SKILL_ARENA_REALTIME_MAX_RATING_GAP: ${SKILL_ARENA_REALTIME_MAX_RATING_GAP:-250}
      SKILL_ARENA_REALTIME_MAX_LATENCY_MS: ${SKILL_ARENA_REALTIME_MAX_LATENCY_MS:-500}
      SKILL_ARENA_REALTIME_MAX_MESSAGE_BYTES: ${SKILL_ARENA_REALTIME_MAX_MESSAGE_BYTES:-8192}
      SKILL_ARENA_REALTIME_CONNECTIONS_PER_MINUTE: ${SKILL_ARENA_REALTIME_CONNECTIONS_PER_MINUTE:-10}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/bin/wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    secrets:
      - metrics_token

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  admin-crm:
    build:
      context: ./admin-crm
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3100
      SKILL_ARENA_API_INTERNAL_URL: http://backend:8080
    ports:
      - "3100:3100"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - metrics_token
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-skillarena-ops}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL is required}
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
  prometheus-data:
  grafana-data:

secrets:
  metrics_token:
    file: ${SKILL_ARENA_METRICS_TOKEN_FILE:?SKILL_ARENA_METRICS_TOKEN_FILE is required}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:?GRAFANA_ADMIN_PASSWORD_FILE is required}
